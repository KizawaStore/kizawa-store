
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kizawa Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:25px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252525}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo span{color:#888}
nav a{color:#aaa;text-decoration:none;margin-left:20px}
.hero{text-align:center;padding:85px 20px}
.hero h1{font-size:55px;margin:0 0 15px}
.hero p{color:#999}
.btn{background:white;color:black;border:0;padding:13px 22px;border-radius:6px;font-weight:bold;cursor:pointer}
.products{padding:30px 8% 80px}
.products h2{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#151515;border:1px solid #292929;border-radius:12px;padding:24px}
.card .emoji{font-size:35px}
.card h3{margin-bottom:8px}
.price{font-size:27px;font-weight:bold}
.stock{color:#999;font-size:13px}
.card button{width:100%;margin-top:15px}
footer{text-align:center;padding:30px;color:#777;border-top:1px solid #252525}
#admin{display:none;padding:30px 8%;background:#151515}
#admin input{padding:12px;margin:5px;background:#222;color:white;border:1px solid #555;border-radius:5px;width:180px}
</style>
</head>
<body>
<header>
<div class="logo">KIZAWA <span>STORE</span></div>
<nav>
<a href="#products">Shop</a>
<a href="#support">Support</a>
</nav>
</header>

<section class="hero">
<h1>KIZAWA STORE</h1>
<p>YOUR DIGITAL SHOP. YOUR BEST DEALS.</p>
<a href="#products"><button class="btn">Découvrir le shop</button></a>
</section>

<section class="products" id="products">
<h2>Nos produits</h2>
<div class="grid" id="catalog"></div>
</section>

<section id="admin">
<h2>Administration</h2>
<p>Gestion des stocks et des prix sur cet appareil.</p>
<div id="adminProducts"></div>
</section>

<footer id="support">
<h3>KIZAWA STORE</h3>
<p>Support client · Digital Shop</p>
<p>© 2026 Kizawa Store</p>
</footer>

<script>
const defaults=[
{id:1,name:"Discord Nitro",price:3,stock:0,icon:"⚡"},
{id:2,name:"Server Boost x14",price:1.50,stock:0,icon:"🚀"},
{id:3,name:"Streaming",price:0,stock:0,icon:"📺"},
{id:4,name:"Gaming",price:0,stock:0,icon:"🎮"},
{id:5,name:"Gift Cards",price:0,stock:0,icon:"🎁"},
{id:6,name:"Special Deals",price:0,stock:0,icon:"💎"}
];

let products=JSON.parse(localStorage.getItem("kizawaProducts"))||defaults;

function save(){
localStorage.setItem("kizawaProducts",JSON.stringify(products));
render();
}

function render(){
document.getElementById("catalog").innerHTML=products.map(p=>`
<div class="card">
<div class="emoji">${p.icon}</div>
<h3>${p.name}</h3>
<div class="price">${Number(p.price).toFixed(2)} €</div>
<p class="stock">Stock : ${p.stock}</p>
<button class="btn" ${p.stock<=0?"disabled":""}
onclick="alert('Contacte le support pour commander.')">
${p.stock>0?"Acheter":"Indisponible"}
</button>
</div>`).join("");
}

function admin(){
let pass=prompt("Mot de passe administrateur");
if(pass!=="Kizawa2026"){
alert("Accès refusé");
return;
}
document.getElementById("admin").style.display="block";
document.getElementById("adminProducts").innerHTML=products.map(p=>`
<div class="card">
<h3>${p.name}</h3>
<input type="number" id="price${p.id}" value="${p.price}" step="0.01">
<input type="number" id="stock${p.id}" value="${p.stock}" min="0">
<button class="btn" onclick="updateProduct(${p.id})">Enregistrer</button>
</div>`).join("");
document.getElementById("admin").scrollIntoView();
}

function updateProduct(id){
let p=products.find(x=>x.id===id);
p.price=Number(document.getElementById("price"+id).value);
p.stock=Number(document.getElementById("stock"+id).value);
save();
alert("Modifications enregistrées !");
adminProducts.innerHTML=products.map(p=>`
<div class="card">
<h3>${p.name}</h3>
<input type="number" id="price${p.id}" value="${p.price}" step="0.01">
<input type="number" id="stock${p.id}" value="${p.stock}" min="0">
<button class="btn" onclick="updateProduct(${p.id})">Enregistrer</button>
</div>`).join("");
}

render();
</script>
</body>
</html>
